<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lab Interpreter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2033"/>
      <stop offset="1" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- субтильная сетка -->
  <g opacity="0.06" stroke="#9fe8df" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- ЭКГ / трендовая линия (отсылка к delta-check) -->
  <polyline fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
    opacity="0.85" filter="url(#soft)"
    points="60,210 180,210 215,210 240,150 270,250 300,120 330,210 470,210 520,210 560,185 610,195 660,120 720,170 980,170 1020,170 1060,140 1100,170 1140,170"/>
  <polyline fill="none" stroke="url(#accent)" stroke-width="2"
    points="60,210 180,210 215,210 240,150 270,250 300,120 330,210 470,210 520,210 560,185 610,195 660,120 720,170 980,170 1020,170 1060,140 1100,170 1140,170"/>

  <!-- медицинский крест-«капля» -->
  <g transform="translate(96,96)">
    <circle r="40" fill="#0e2a2a" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="-7" y="-22" width="14" height="44" rx="4" fill="url(#accent)"/>
    <rect x="-22" y="-7" width="44" height="14" rx="4" fill="url(#accent)"/>
  </g>

  <text x="170" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">Lab Interpreter</text>
  <text x="172" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8ad8cf">Детерминированная офлайн-расшифровка медицинских анализов</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">
    <g transform="translate(170,205)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#13263b"/>
      <text x="75" y="23" text-anchor="middle">250 аналитов</text>
    </g>
    <g transform="translate(330,205)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#13263b"/>
      <text x="70" y="23" text-anchor="middle">30 панелей</text>
    </g>
    <g transform="translate(480,205)">
      <rect x="0" y="0" width="190" height="34" rx="17" fill="#13263b"/>
      <text x="95" y="23" text-anchor="middle">OCR · delta-check</text>
    </g>
    <g transform="translate(680,205)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0e2e27"/>
      <text x="75" y="23" text-anchor="middle" fill="#5eead4">100% offline</text>
    </g>
  </g>
</svg>
